<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Engineer Playground — Streaming Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.45);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #818cf8;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(129, 140, 248, 0.25);
            --user-msg-bg: rgba(99, 102, 241, 0.15);
            --bot-msg-bg: rgba(255, 255, 255, 0.03);
            --system-bg: rgba(234, 179, 8, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            height: 85vh;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Sidebar Settings */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--panel-border);
            padding-right: 24px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--panel-border);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-text p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .setting-group select, .setting-group textarea {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            color: var(--text-main);
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .setting-group select:focus, .setting-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .setting-group textarea {
            resize: none;
            height: 120px;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Chat Panel */
        .chat-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--panel-border);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #10b981;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* Message Bubbles */
        .message {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
            animation: messageFade 0.4s ease;
        }

        @keyframes messageFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg-bg);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bot-msg-bg);
            border: 1px solid var(--panel-border);
            border-bottom-left-radius: 4px;
        }

        .message.system {
            align-self: center;
            background: var(--system-bg);
            border: 1px solid rgba(234, 179, 8, 0.2);
            color: #f59e0b;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 30px;
        }

        .message code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(15, 23, 42, 0.8);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        /* Input Area */
        .input-container {
            display: flex;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--panel-border);
        }

        .chat-input {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            color: var(--text-main);
            padding: 16px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 0 24px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .send-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .send-btn:active {
            transform: translateY(1px);
        }

        .send-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        /* Custom Scrollbar */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .messages-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Configuration Sidebar -->
        <div class="sidebar">
            <div class="logo-section">
                <div class="logo-icon">⚡</div>
                <div class="logo-text">
                    <h1>AI API Playground</h1>
                    <p>Semaine 2 — FastAPI Streaming</p>
                </div>
            </div>

            <div class="setting-group">
                <label for="model-select">Modèle LLM (Ollama)</label>
                <select id="model-select">
                    <option value="llama3.2">llama3.2 (défaut)</option>
                    <option value="llama3.1">llama3.1</option>
                    <option value="mistral">mistral</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="system-prompt">System Prompt</label>
                <textarea id="system-prompt">Tu es un assistant IA utile, concis et amical. Réponds toujours en français.</textarea>
            </div>
            
            <div style="flex: 1;"></div>
            
            <p style="font-size: 11px; color: var(--text-muted); text-align: center; line-height: 1.4;">
                Conforme au <code>learning-system.md</code><br>
                Second Brain compounding.
            </p>
        </div>

        <!-- Chat Container -->
        <div class="chat-panel">
            <div class="chat-header">
                <h2 style="font-size: 16px; font-weight: 600;">Flux de Chat SSE</h2>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>Serveur Actif</span>
                </div>
            </div>

            <div class="messages-container" id="messages-box">
                <div class="message system">
                    Bienvenue dans la démo de streaming ! Tapez un message pour démarrer le flux Server-Sent Events.
                </div>
            </div>

            <div class="input-container">
                <input type="text" class="chat-input" id="user-input" placeholder="Dis-moi ce que tu veux apprendre..." autocomplete="off">
                <button class="send-btn" id="send-button">Envoyer</button>
            </div>
        </div>
    </div>

    <script>
        const messagesBox = document.getElementById('messages-box');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const modelSelect = document.getElementById('model-select');
        const systemPromptArea = document.getElementById('system-prompt');

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendButton.disabled) {
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Disable input while generating
            userInput.value = '';
            userInput.disabled = true;
            sendButton.disabled = true;

            // Append user message to UI
            appendMessage(text, 'user');

            // Create bot message element for typing effect
            const botMessageEl = appendMessage('', 'bot');
            
            try {
                const response = await fetch('/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: text,
                        system_prompt: systemPromptArea.value,
                        model: modelSelect.value
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop(); // Conserve la ligne incomplète dans le buffer

                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            // On extrait le token (en enlevant "data: ")
                            const token = line.substring(5);
                            
                            if (token.trim() === '[DONE]') {
                                // Fin du flux
                                break;
                            } else if (token.trim().startsWith('[ERREUR]')) {
                                botMessageEl.innerHTML += `<br><span style="color: #ef4444;">${token}</span>`;
                            } else {
                                // Injecte le token et scrolle vers le bas
                                botMessageEl.textContent += token;
                                messagesBox.scrollTop = messagesBox.scrollHeight;
                            }
                        }
                    }
                }
            } catch (err) {
                botMessageEl.innerHTML = `<span style="color: #ef4444;">Erreur de connexion : ${err.message}. Assure-toi que le serveur FastAPI et Ollama tournent.</span>`;
            } finally {
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            messagesBox.appendChild(msgDiv);
            messagesBox.scrollTop = messagesBox.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
